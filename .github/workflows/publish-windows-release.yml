name: Publish signed Windows release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Git tag for the draft release, for example v2.1.0
        required: true
        type: string
      expected_sha:
        description: Full 40-character SHA currently on the default branch
        required: true
        type: string
      release_notes:
        description: Short release note shown in GitHub Releases and the updater
        required: true
        type: string

# 只允许手动发布。公开仓库使用标准 runner 时不收 Actions 分钟费；
# release 仍先创建为 draft，负责人确认后再 Publish。
permissions:
  contents: write

concurrency:
  group: signed-windows-release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  publish-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 固定到已确认的提交，并拉取 Tag 以阻止重用旧版本号。
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0

      - name: Verify default branch, commit and fresh tag
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          PUBLISH_REF: ${{ github.ref }}
        run: |
          if ($env:PUBLISH_REF -ne 'refs/heads/master') { throw '签名发布只能从默认分支 master 手动运行。' }
          if ($env:EXPECTED_SHA -notmatch '^[0-9a-fA-F]{40}$') { throw 'expected_sha 必须是完整的 40 位提交 SHA。' }
          $actual = (git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($actual -ne $env:EXPECTED_SHA.ToLowerInvariant()) { throw "请求提交与检出提交不一致。expected=$env:EXPECTED_SHA actual=$actual" }
          if ($env:RELEASE_TAG -notmatch '^v(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)$') { throw 'release_tag 必须是 vX.Y.Z，不能复用测试或浮动 Tag。' }
          $existing = git rev-parse --verify --quiet "refs/tags/$env:RELEASE_TAG^{commit}"
          if ($LASTEXITCODE -eq 0 -and $existing) { throw "Tag $env:RELEASE_TAG 已存在，拒绝重用或移动已有 Tag。" }
          # 无 Tag 的退出码 1 是预期结果，不能让 GitHub 的 pwsh 尾声误判整个步骤失败。
          if ($LASTEXITCODE -ne 1) { throw '无法核对本地 Tag 状态。' }
          $global:LASTEXITCODE = 0

      - name: Check release credentials without printing them
        shell: pwsh
        env:
          UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          UPDATER_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          UPDATER_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:UPDATER_PUBLIC_KEY)) { throw '仓库变量 TAURI_UPDATER_PUBLIC_KEY 未配置。' }
          if ([string]::IsNullOrWhiteSpace($env:UPDATER_PRIVATE_KEY)) { throw '仓库 Secret TAURI_SIGNING_PRIVATE_KEY 未配置。' }
          if ($null -eq $env:UPDATER_PRIVATE_KEY_PASSWORD) { throw '仓库 Secret TAURI_SIGNING_PRIVATE_KEY_PASSWORD 未配置。' }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Verify editor before release
        run: |
          npm run typecheck
          npm run lint
          npm run test:run
          npm run test:release-manifest
          npm run test:release-check

      - name: Verify release context and versions
        shell: pwsh
        env:
          GITHUB_DEFAULT_BRANCH: master
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_UPDATER_ENDPOINT: ${{ vars.TAURI_UPDATER_ENDPOINT }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: npm run release:check -- preflight --tag "$env:RELEASE_TAG" --expected-sha "$env:EXPECTED_SHA"

      - name: Generate ephemeral updater configuration
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_UPDATER_ENDPOINT: ${{ vars.TAURI_UPDATER_ENDPOINT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/prepare-updater-config.mjs

      - name: Build signed Windows installer
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run build:win -- --config .github/generated/updater-config.json

      - name: Verify actual signed artifacts before upload
        shell: pwsh
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_UPDATER_ENDPOINT: ${{ vars.TAURI_UPDATER_ENDPOINT }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          $bundle = 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis'
          npm run release:check -- artifacts --tag "$env:RELEASE_TAG" --expected-sha "$env:EXPECTED_SHA" --bundle-dir $bundle --out release/signed-windows

      - name: Recheck remote tag before creating draft
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          git ls-remote --exit-code --refs origin "refs/tags/$env:RELEASE_TAG" *> $null
          if ($LASTEXITCODE -eq 0) { throw "Tag $env:RELEASE_TAG 在验签期间已被占用，拒绝修改已有 Tag 或 Release。" }
          if ($LASTEXITCODE -ne 2) { throw '无法确认远端 Tag 状态，拒绝继续上传。' }
          $global:LASTEXITCODE = 0

      - name: Create draft release after verification
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          target_commitish: ${{ inputs.expected_sha }}
          name: SVGA Editor Pro ${{ inputs.release_tag }}
          body: ${{ inputs.release_notes }}
          draft: true
          prerelease: false
          files: release/signed-windows/*
