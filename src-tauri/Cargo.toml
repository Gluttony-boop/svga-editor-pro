[package]
name = "svga-editor-pro"
version = "2.0.0"
description = "SVGA Editor Pro - 专业SVGA动画编辑器"
authors = ["郑任光"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }
prost-build = "0.13"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
# Protobuf
prost = "0.13"
# 压缩
flate2 = "1.0"
# Base64
base64 = "0.22"
# 异步
tokio = { version = "1", features = ["sync"] }
# 打开外部链接
open = "5"
