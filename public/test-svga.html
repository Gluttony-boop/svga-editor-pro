<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SVGA 导出测试</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
      background: #f5f5f5;
    }
    .container {
      background: white;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h1, h2, h3 {
      margin-top: 0;
    }
    .test-area {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 20px;
    }
    .canvas-container {
      border: 2px solid #e0e0e0;
      border-radius: 4px;
      padding: 10px;
      text-align: center;
    }
    canvas {
      border: 1px solid #ccc;
      background: #fafafa;
      max-width: 100%;
      height: auto;
    }
    .log {
      background: #1e1e1e;
      color: #d4d4d4;
      padding: 15px;
      border-radius: 4px;
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 12px;
      max-height: 400px;
      overflow-y: auto;
      white-space: pre-wrap;
    }
    .log.error {
      color: #f48771;
    }
    .log.success {
      color: #89d185;
    }
    .log.info {
      color: #6a9fb5;
    }
    .actions {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s;
    }
    button.primary {
      background: #1976d2;
      color: white;
    }
    button.primary:hover {
      background: #1565c0;
    }
    button.secondary {
      background: #e0e0e0;
      color: #333;
    }
    button.secondary:hover {
      background: #d0d0d0;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    input[type="file"] {
      display: none;
    }
    .file-label {
      display: inline-block;
      padding: 10px 20px;
      background: #4caf50;
      color: white;
      border-radius: 4px;
      cursor: pointer;
    }
    .file-label:hover {
      background: #45a049;
    }
    .comparison {
      margin-top: 20px;
    }
    .comparison table {
      width: 100%;
      border-collapse: collapse;
    }
    .comparison th, .comparison td {
      border: 1px solid #e0e0e0;
      padding: 8px 12px;
      text-align: left;
    }
    .comparison th {
      background: #f5f5f5;
      font-weight: 600;
    }
    .diff {
      color: #f44336;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🧪 SVGA 导出测试工具</h1>
    <p>此工具用于测试 SVGA 导出功能是否正常工作</p>
    
    <div class="actions">
      <label class="file-label" for="file-input">
        📁 选择 SVGA 文件
      </label>
      <input type="file" id="file-input" accept=".svga">
      <button class="primary" id="export-btn" disabled>📤 导出测试</button>
      <button class="primary" id="compare-btn" disabled>🔄 对比测试</button>
      <button class="secondary" id="clear-btn">🗑️ 清除</button>
    </div>
  </div>

  <div class="container">
    <h2>📊 分析结果</h2>
    <div class="test-area">
      <div class="canvas-container">
        <h3>原始文件</h3>
        <canvas id="original-canvas"></canvas>
        <div id="original-info"></div>
      </div>
      <div class="canvas-container">
        <h3>导出文件</h3>
        <canvas id="exported-canvas"></canvas>
        <div id="exported-info"></div>
      </div>
    </div>
    
    <div class="comparison" id="comparison" style="display: none;">
      <h3>对比结果</h3>
      <table>
        <thead>
          <tr>
            <th>项目</th>
            <th>原始</th>
            <th>导出</th>
            <th>状态</th>
          </tr>
        </thead>
        <tbody id="comparison-body"></tbody>
      </table>
    </div>
  </div>

  <div class="container">
    <h2>📝 日志</h2>
    <div class="log" id="log"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/protobufjs@7.2.5/dist/protobuf.min.js"></script>
  <script>
    // SVGA Proto 定义
    const SVGA_PROTO = {
      nested: {
        com: {
          nested: {
            opensource: {
              nested: {
                svga: {
                  options: {
                    objc_class_prefix: 'SVGAProto',
                    java_package: 'com.opensource.svgaplayer'
                  },
                  nested: {
                    MovieParams: {
                      fields: {
                        viewBoxWidth: { type: 'float', id: 1 },
                        viewBoxHeight: { type: 'float', id: 2 },
                        fps: { type: 'int32', id: 3 },
                        frames: { type: 'int32', id: 4 }
                      }
                    },
                    SpriteEntity: {
                      fields: {
                        imageKey: { type: 'string', id: 1 },
                        frames: { rule: 'repeated', type: 'FrameEntity', id: 2 }
                      }
                    },
                    Layout: {
                      fields: {
                        x: { type: 'float', id: 1 },
                        y: { type: 'float', id: 2 },
                        width: { type: 'float', id: 3 },
                        height: { type: 'float', id: 4 }
                      }
                    },
                    Transform: {
                      fields: {
                        a: { type: 'float', id: 1 },
                        b: { type: 'float', id: 2 },
                        c: { type: 'float', id: 3 },
                        d: { type: 'float', id: 4 },
                        tx: { type: 'float', id: 5 },
                        ty: { type: 'float', id: 6 }
                      }
                    },
                    ShapeEntity: {
                      oneofs: {
                        args: {
                          oneof: ['shape', 'rect', 'ellipse']
                        }
                      },
                      fields: {
                        type: { type: 'ShapeType', id: 1 },
                        shape: { type: 'ShapeArgs', id: 2 },
                        rect: { type: 'RectArgs', id: 3 },
                        ellipse: { type: 'EllipseArgs', id: 4 },
                        styles: { type: 'ShapeStyle', id: 10 },
                        transform: { type: 'Transform', id: 11 }
                      },
                      nested: {
                        ShapeType: {
                          values: {
                            SHAPE: 0,
                            RECT: 1,
                            ELLIPSE: 2,
                            KEEP: 3
                          }
                        },
                        ShapeArgs: {
                          fields: {
                            d: { type: 'string', id: 1 }
                          }
                        },
                        RectArgs: {
                          fields: {
                            x: { type: 'float', id: 1 },
                            y: { type: 'float', id: 2 },
                            width: { type: 'float', id: 3 },
                            height: { type: 'float', id: 4 },
                            cornerRadius: { type: 'float', id: 5 }
                          }
                        },
                        EllipseArgs: {
                          fields: {
                            x: { type: 'float', id: 1 },
                            y: { type: 'float', id: 2 },
                            radiusX: { type: 'float', id: 3 },
                            radiusY: { type: 'float', id: 4 }
                          }
                        },
                        ShapeStyle: {
                          fields: {
                            fill: { type: 'RGBAColor', id: 1 },
                            stroke: { type: 'RGBAColor', id: 2 },
                            strokeWidth: { type: 'float', id: 3 },
                            lineCap: { type: 'LineCap', id: 4 },
                            lineJoin: { type: 'LineJoin', id: 5 },
                            miterLimit: { type: 'float', id: 6 },
                            lineDashI: { type: 'float', id: 7 },
                            lineDashII: { type: 'float', id: 8 },
                            lineDashIII: { type: 'float', id: 9 }
                          },
                          nested: {
                            RGBAColor: {
                              fields: {
                                r: { type: 'float', id: 1 },
                                g: { type: 'float', id: 2 },
                                b: { type: 'float', id: 3 },
                                a: { type: 'float', id: 4 }
                              }
                            },
                            LineCap: {
                              values: {
                                LineCap_BUTT: 0,
                                LineCap_ROUND: 1,
                                LineCap_SQUARE: 2
                              }
                            },
                            LineJoin: {
                              values: {
                                LineJoin_MITER: 0,
                                LineJoin_ROUND: 1,
                                LineJoin_BEVEL: 2
                              }
                            }
                          }
                        }
                      }
                    },
                    FrameEntity: {
                      fields: {
                        alpha: { type: 'float', id: 1 },
                        layout: { type: 'Layout', id: 2 },
                        transform: { type: 'Transform', id: 3 },
                        clipPath: { type: 'string', id: 4 },
                        shapes: { rule: 'repeated', type: 'ShapeEntity', id: 5 }
                      }
                    },
                    MovieEntity: {
                      fields: {
                        version: { type: 'string', id: 1 },
                        params: { type: 'MovieParams', id: 2 },
                        images: { rule: 'map', keyType: 'string', type: 'bytes', id: 3 },
                        sprites: { rule: 'repeated', type: 'SpriteEntity', id: 4 }
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    };

    let MovieEntity = null;
    let originalBuffer = null;
    let originalMovieObj = null;

    // 初始化 protobuf
    async function initProtobuf() {
      const root = protobuf.Root.fromJSON(SVGA_PROTO);
      MovieEntity = root.lookupType('com.opensource.svga.MovieEntity');
      log('Protobuf 初始化成功', 'success');
    }

    // 日志函数
    function log(message, type = 'info') {
      const logDiv = document.getElementById('log');
      const timestamp = new Date().toLocaleTimeString();
      const line = document.createElement('div');
      line.className = `log ${type}`;
      line.textContent = `[${timestamp}] ${message}`;
      logDiv.appendChild(line);
      logDiv.scrollTop = logDiv.scrollHeight;
      console.log(`[${type.toUpperCase()}]`, message);
    }

    // 解析 SVGA
    async function parseSVGA(buffer) {
      const data = new Uint8Array(buffer);
      
      // 检查文件头
      const magic = String.fromCharCode(...data.slice(0, 4));
      let version = 0x02; // 默认版本 2.0
      let decompressed;
      
      if (magic === 'SVGA') {
        // 标准SVGA格式，有文件头
        version = data[4];
        log(`SVGA 版本: ${version === 0x02 ? '2.0' : '1.0'} (标准格式)`);
        
        // 解压
        if (version === 0x02) {
          decompressed = pako.inflate(data.slice(8));
        } else {
          decompressed = data.slice(8);
        }
      } else {
        // 没有文件头，尝试直接解压
        log('检测到无文件头格式，尝试直接解压...', 'info');
        
        try {
          decompressed = pako.inflate(data);
          version = 0x02;
          log('直接解压成功 (SVGA 2.0 格式)', 'success');
        } catch (e) {
          // 如果解压失败，可能是未压缩的原始protobuf数据
          log('解压失败，尝试作为原始protobuf数据解析...', 'info');
          decompressed = data;
          version = 0x01;
        }
      }
      
      log(`解压后大小: ${decompressed.length} 字节`);
      
      // 解码
      const message = MovieEntity.decode(decompressed);
      const movieObj = MovieEntity.toObject(message, {
        bytes: Uint8Array,
        arrays: true,
        objects: true
      });
      
      return { movieObj, version, decompressed };
    }

    // 分析图片
    function analyzeImages(movieObj) {
      const images = [];
      if (movieObj.images) {
        for (const key of Object.keys(movieObj.images)) {
          const data = movieObj.images[key];
          const mime = getImageMimeType(data);
          images.push({
            key,
            size: data.length,
            mime,
            valid: validateImageHeader(data, mime)
          });
        }
      }
      return images;
    }

    // 获取图片 MIME 类型
    function getImageMimeType(data) {
      if (!data || data.length < 12) return 'unknown';
      
      if (data[0] === 0x89 && data[1] === 0x50 && data[2] === 0x4E && data[3] === 0x47) {
        return 'image/png';
      }
      if (data[0] === 0xFF && data[1] === 0xD8) {
        return 'image/jpeg';
      }
      if (data[0] === 0x52 && data[1] === 0x49 && data[2] === 0x46 && data[3] === 0x46 &&
          data[8] === 0x57 && data[9] === 0x45 && data[10] === 0x42 && data[11] === 0x50) {
        return 'image/webp';
      }
      if (data[0] === 0x47 && data[1] === 0x49 && data[2] === 0x46) {
        return 'image/gif';
      }
      return 'unknown';
    }

    // 验证图片头
    function validateImageHeader(data, mime) {
      if (!data || data.length < 4) return false;
      
      switch (mime) {
        case 'image/png':
          return data[0] === 0x89 && data[1] === 0x50 && data[2] === 0x4E && data[3] === 0x47;
        case 'image/jpeg':
          return data[0] === 0xFF && data[1] === 0xD8;
        case 'image/webp':
          return data[0] === 0x52 && data[1] === 0x49 && data[2] === 0x46 && data[3] === 0x46;
        case 'image/gif':
          return data[0] === 0x47 && data[1] === 0x49 && data[2] === 0x46;
        default:
          return false;
      }
    }

    // 导出 SVGA（不修改任何内容，仅重新编码）
    async function exportSVGA(movieObj, version) {
      log('开始导出...');
      
      // 创建新消息
      const newMessage = MovieEntity.create(movieObj);
      
      // 编码
      const encoded = MovieEntity.encode(newMessage).finish();
      log(`编码后大小: ${encoded.length} 字节`);
      
      // 验证可以解码
      const verifyMessage = MovieEntity.decode(encoded);
      const verifyObj = MovieEntity.toObject(verifyMessage, { bytes: Uint8Array });
      log(`验证: ${Object.keys(verifyObj.images || {}).length} 张图片`);
      
      // 压缩
      const compressed = pako.deflate(encoded, { level: 6 });
      log(`压缩后大小: ${compressed.length} 字节`);
      
      // 构建文件头
      const header = new Uint8Array([0x53, 0x56, 0x47, 0x41, version, 0x00, 0x00, 0x00]);
      const result = new Uint8Array(header.length + compressed.length);
      result.set(header, 0);
      result.set(compressed, header.length);
      
      log(`最终文件大小: ${result.length} 字节`, 'success');
      
      return result;
    }

    // 显示分析结果
    function displayAnalysis(infoDiv, movieObj, images, version) {
      infoDiv.innerHTML = `
        <p><strong>版本:</strong> ${version === 0x02 ? '2.0' : '1.0'}</p>
        <p><strong>尺寸:</strong> ${movieObj.params?.viewBoxWidth || 0} x ${movieObj.params?.viewBoxHeight || 0}</p>
        <p><strong>帧数:</strong> ${movieObj.params?.frames || 0}</p>
        <p><strong>帧率:</strong> ${movieObj.params?.fps || 0} fps</p>
        <p><strong>图片数:</strong> ${images.length}</p>
        <p><strong>精灵数:</strong> ${movieObj.sprites?.length || 0}</p>
        <details>
          <summary>图片列表</summary>
          <ul>
            ${images.map(img => `
              <li>
                <strong>${img.key}</strong>: ${img.mime}, ${img.size} 字节
                ${img.valid ? '✅' : '❌'}
              </li>
            `).join('')}
          </ul>
        </details>
      `;
    }

    // 对比两个文件
    function compareFiles(original, exported) {
      const tbody = document.getElementById('comparison-body');
      const rows = [
        ['版本', original.header.version, exported.header.version],
        ['宽度', original.protobuf.params?.viewBoxWidth, exported.protobuf.params?.viewBoxWidth],
        ['高度', original.protobuf.params?.viewBoxHeight, exported.protobuf.params?.viewBoxHeight],
        ['帧数', original.protobuf.params?.frames, exported.protobuf.params?.frames],
        ['图片数', original.protobuf.imagesKeys.length, exported.protobuf.imagesKeys.length],
        ['精灵数', original.protobuf.spritesCount, exported.protobuf.spritesCount],
        ['解压后大小', `${original.protobuf.rawSize} 字节`, `${exported.protobuf.rawSize} 字节`]
      ];
      
      tbody.innerHTML = rows.map(([label, orig, exp]) => {
        const diff = orig !== exp ? 'diff' : '';
        const status = orig !== exp ? '❌ 不同' : '✅ 相同';
        return `
          <tr>
            <td>${label}</td>
            <td>${orig}</td>
            <td class="${diff}">${exp}</td>
            <td>${status}</td>
          </tr>
        `;
      }).join('');
      
      document.getElementById('comparison').style.display = 'block';
    }

    // 初始化
    document.addEventListener('DOMContentLoaded', async () => {
      await initProtobuf();
      
      const fileInput = document.getElementById('file-input');
      const exportBtn = document.getElementById('export-btn');
      const compareBtn = document.getElementById('compare-btn');
      const clearBtn = document.getElementById('clear-btn');
      
      // 文件选择
      fileInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        
        log(`加载文件: ${file.name} (${file.size} 字节)`);
        
        try {
          originalBuffer = await file.arrayBuffer();
          const result = await parseSVGA(originalBuffer);
          originalMovieObj = result.movieObj;
          
          const images = analyzeImages(result.movieObj);
          displayAnalysis(
            document.getElementById('original-info'),
            result.movieObj,
            images,
            result.version
          );
          
          exportBtn.disabled = false;
          compareBtn.disabled = true;
          
          log('文件加载成功', 'success');
        } catch (err) {
          log(`加载失败: ${err.message}`, 'error');
          console.error(err);
        }
      });
      
      // 导出测试
      exportBtn.addEventListener('click', async () => {
        if (!originalMovieObj) return;
        
        try {
          log('--- 开始导出测试 ---', 'info');
          
          const result = await parseSVGA(originalBuffer);
          const exported = await exportSVGA(result.movieObj, result.version);
          
          // 分析导出的文件
          const exportedResult = await parseSVGA(exported.buffer);
          const images = analyzeImages(exportedResult.movieObj);
          displayAnalysis(
            document.getElementById('exported-info'),
            exportedResult.movieObj,
            images,
            exportedResult.version
          );
          
          // 下载
          const blob = new Blob([exported], { type: 'application/octet-stream' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'exported.svga';
          a.click();
          URL.revokeObjectURL(url);
          
          // 启用对比
          compareBtn.disabled = false;
          
          log('导出成功！', 'success');
        } catch (err) {
          log(`导出失败: ${err.message}`, 'error');
          console.error(err);
        }
      });
      
      // 对比测试
      compareBtn.addEventListener('click', async () => {
        if (!originalBuffer || !originalMovieObj) return;
        
        try {
          log('--- 开始对比测试 ---', 'info');
          
          const result = await parseSVGA(originalBuffer);
          const exported = await exportSVGA(result.movieObj, result.version);
          const exportedResult = await parseSVGA(exported.buffer);
          
          const originalInfo = {
            header: { version: result.version },
            protobuf: {
              params: result.movieObj.params,
              imagesKeys: Object.keys(result.movieObj.images || {}),
              spritesCount: result.movieObj.sprites?.length || 0,
              rawSize: result.decompressed.length
            }
          };
          
          const exportedInfo = {
            header: { version: exportedResult.version },
            protobuf: {
              params: exportedResult.movieObj.params,
              imagesKeys: Object.keys(exportedResult.movieObj.images || {}),
              spritesCount: exportedResult.movieObj.sprites?.length || 0,
              rawSize: exportedResult.decompressed.length
            }
          };
          
          compareFiles(originalInfo, exportedInfo);
          
          log('对比完成', 'success');
        } catch (err) {
          log(`对比失败: ${err.message}`, 'error');
          console.error(err);
        }
      });
      
      // 清除
      clearBtn.addEventListener('click', () => {
        originalBuffer = null;
        originalMovieObj = null;
        document.getElementById('original-info').innerHTML = '';
        document.getElementById('exported-info').innerHTML = '';
        document.getElementById('comparison').style.display = 'none';
        document.getElementById('log').innerHTML = '';
        exportBtn.disabled = true;
        compareBtn.disabled = true;
        log('已清除', 'info');
      });
    });
  </script>
</body>
</html>
