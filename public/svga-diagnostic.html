<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SVGA 深度诊断工具</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
      background: #f5f5f5;
    }
    .container {
      background: white;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h1, h2, h3 { margin-top: 0; }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    .log {
      background: #1e1e1e;
      color: #d4d4d4;
      padding: 15px;
      border-radius: 4px;
      font-family: 'Consolas', monospace;
      font-size: 11px;
      max-height: 500px;
      overflow-y: auto;
      white-space: pre-wrap;
    }
    .log.error { color: #f48771; }
    .log.success { color: #89d185; }
    .log.warn { color: #dcdcaa; }
    .log.info { color: #6a9fb5; }
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      margin-right: 10px;
    }
    button.primary { background: #1976d2; color: white; }
    button.secondary { background: #e0e0e0; color: #333; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    input[type="file"] { display: none; }
    label.file-label {
      display: inline-block;
      padding: 10px 20px;
      background: #4caf50;
      color: white;
      border-radius: 4px;
      cursor: pointer;
      margin-right: 10px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      border: 1px solid #e0e0e0;
      padding: 8px 12px;
      text-align: left;
      font-size: 13px;
    }
    th { background: #f5f5f5; font-weight: 600; }
    .diff { color: #f44336; font-weight: 500; background: #fff3e0; }
    .same { color: #4caf50; }
    canvas {
      border: 1px solid #ccc;
      background: #fafafa;
      max-width: 100%;
    }
    .image-preview {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 10px;
    }
    .image-item {
      border: 1px solid #e0e0e0;
      border-radius: 4px;
      padding: 5px;
      text-align: center;
    }
    .image-item img {
      max-width: 80px;
      max-height: 80px;
    }
    .image-item p {
      margin: 5px 0 0 0;
      font-size: 11px;
      color: #666;
    }
    .hex-view {
      font-family: 'Consolas', monospace;
      font-size: 11px;
      background: #f5f5f5;
      padding: 10px;
      border-radius: 4px;
      max-height: 200px;
      overflow-y: auto;
    }
    .hex-line { margin: 2px 0; }
    .hex-offset { color: #666; }
    .hex-bytes { color: #333; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔬 SVGA 深度诊断工具</h1>
    <p>详细对比原始文件和导出文件，诊断播放失败的原因</p>
    
    <div style="margin-top: 20px;">
      <label class="file-label" for="file-input">📁 选择 SVGA 文件</label>
      <input type="file" id="file-input" accept=".svga">
      <button class="primary" id="export-btn" disabled>📤 导出并对比</button>
      <button class="secondary" id="download-original-btn" disabled>💾 下载原始文件(标准格式)</button>
      <button class="secondary" id="download-exported-btn" disabled>💾 下载导出文件</button>
    </div>
  </div>

  <div class="container">
    <h2>📊 对比结果</h2>
    <div id="comparison-results"></div>
  </div>

  <div class="container">
    <h2>🖼️ 图片对比</h2>
    <div class="grid">
      <div>
        <h3>原始文件图片</h3>
        <div class="image-preview" id="original-images"></div>
      </div>
      <div>
        <h3>导出文件图片</h3>
        <div class="image-preview" id="exported-images"></div>
      </div>
    </div>
  </div>

  <div class="container">
    <h2>🔍 文件头对比</h2>
    <div class="grid">
      <div>
        <h3>原始文件</h3>
        <div class="hex-view" id="original-hex"></div>
      </div>
      <div>
        <h3>导出文件</h3>
        <div class="hex-view" id="exported-hex"></div>
      </div>
    </div>
  </div>

  <div class="container">
    <h2>📝 详细日志</h2>
    <div class="log" id="log"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/protobufjs@7.2.5/dist/protobuf.min.js"></script>
  <script>
    // SVGA Proto 定义
    const SVGA_PROTO = {
      nested: {
        com: {
          nested: {
            opensource: {
              nested: {
                svga: {
                  options: {
                    objc_class_prefix: 'SVGAProto',
                    java_package: 'com.opensource.svgaplayer'
                  },
                  nested: {
                    MovieParams: {
                      fields: {
                        viewBoxWidth: { type: 'float', id: 1 },
                        viewBoxHeight: { type: 'float', id: 2 },
                        fps: { type: 'int32', id: 3 },
                        frames: { type: 'int32', id: 4 }
                      }
                    },
                    SpriteEntity: {
                      fields: {
                        imageKey: { type: 'string', id: 1 },
                        frames: { rule: 'repeated', type: 'FrameEntity', id: 2 }
                      }
                    },
                    Layout: {
                      fields: {
                        x: { type: 'float', id: 1 },
                        y: { type: 'float', id: 2 },
                        width: { type: 'float', id: 3 },
                        height: { type: 'float', id: 4 }
                      }
                    },
                    Transform: {
                      fields: {
                        a: { type: 'float', id: 1 },
                        b: { type: 'float', id: 2 },
                        c: { type: 'float', id: 3 },
                        d: { type: 'float', id: 4 },
                        tx: { type: 'float', id: 5 },
                        ty: { type: 'float', id: 6 }
                      }
                    },
                    ShapeEntity: {
                      oneofs: { args: { oneof: ['shape', 'rect', 'ellipse'] } },
                      fields: {
                        type: { type: 'ShapeType', id: 1 },
                        shape: { type: 'ShapeArgs', id: 2 },
                        rect: { type: 'RectArgs', id: 3 },
                        ellipse: { type: 'EllipseArgs', id: 4 },
                        styles: { type: 'ShapeStyle', id: 10 },
                        transform: { type: 'Transform', id: 11 }
                      },
                      nested: {
                        ShapeType: { values: { SHAPE: 0, RECT: 1, ELLIPSE: 2, KEEP: 3 } },
                        ShapeArgs: { fields: { d: { type: 'string', id: 1 } } },
                        RectArgs: {
                          fields: {
                            x: { type: 'float', id: 1 },
                            y: { type: 'float', id: 2 },
                            width: { type: 'float', id: 3 },
                            height: { type: 'float', id: 4 },
                            cornerRadius: { type: 'float', id: 5 }
                          }
                        },
                        EllipseArgs: {
                          fields: {
                            x: { type: 'float', id: 1 },
                            y: { type: 'float', id: 2 },
                            radiusX: { type: 'float', id: 3 },
                            radiusY: { type: 'float', id: 4 }
                          }
                        },
                        ShapeStyle: {
                          fields: {
                            fill: { type: 'RGBAColor', id: 1 },
                            stroke: { type: 'RGBAColor', id: 2 },
                            strokeWidth: { type: 'float', id: 3 },
                            lineCap: { type: 'LineCap', id: 4 },
                            lineJoin: { type: 'LineJoin', id: 5 },
                            miterLimit: { type: 'float', id: 6 },
                            lineDashI: { type: 'float', id: 7 },
                            lineDashII: { type: 'float', id: 8 },
                            lineDashIII: { type: 'float', id: 9 }
                          },
                          nested: {
                            RGBAColor: {
                              fields: {
                                r: { type: 'float', id: 1 },
                                g: { type: 'float', id: 2 },
                                b: { type: 'float', id: 3 },
                                a: { type: 'float', id: 4 }
                              }
                            },
                            LineCap: { values: { LineCap_BUTT: 0, LineCap_ROUND: 1, LineCap_SQUARE: 2 } },
                            LineJoin: { values: { LineJoin_MITER: 0, LineJoin_ROUND: 1, LineJoin_BEVEL: 2 } }
                          }
                        }
                      }
                    },
                    FrameEntity: {
                      fields: {
                        alpha: { type: 'float', id: 1 },
                        layout: { type: 'Layout', id: 2 },
                        transform: { type: 'Transform', id: 3 },
                        clipPath: { type: 'string', id: 4 },
                        shapes: { rule: 'repeated', type: 'ShapeEntity', id: 5 }
                      }
                    },
                    MovieEntity: {
                      fields: {
                        version: { type: 'string', id: 1 },
                        params: { type: 'MovieParams', id: 2 },
                        images: { rule: 'map', keyType: 'string', type: 'bytes', id: 3 },
                        sprites: { rule: 'repeated', type: 'SpriteEntity', id: 4 }
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    };

    let MovieEntity = null;
    let MovieEntityLite = null;
    let originalBuffer = null;
    let exportedBuffer = null;

    async function initProtobuf() {
      const root = protobuf.Root.fromJSON(SVGA_PROTO);
      MovieEntity = root.lookupType('com.opensource.svga.MovieEntity');
      
      // 创建 lite 版本的 protobuf
      const SVGA_PROTO_LITE = {
        nested: {
          svga: {
            nested: {
              MovieParams: {
                fields: {
                  viewBoxWidth: { type: 'float', id: 1 },
                  viewBoxHeight: { type: 'float', id: 2 },
                  fps: { type: 'int32', id: 3 },
                  frames: { type: 'int32', id: 4 }
                }
              },
              Sprite: {
                fields: {
                  imageKey: { type: 'string', id: 1 },
                  frames: { rule: 'repeated', type: 'Frame', id: 2 }
                }
              },
              Layout: {
                fields: {
                  x: { type: 'float', id: 1 },
                  y: { type: 'float', id: 2 },
                  width: { type: 'float', id: 3 },
                  height: { type: 'float', id: 4 }
                }
              },
              Transform: {
                fields: {
                  a: { type: 'float', id: 1 },
                  b: { type: 'float', id: 2 },
                  c: { type: 'float', id: 3 },
                  d: { type: 'float', id: 4 },
                  tx: { type: 'float', id: 5 },
                  ty: { type: 'float', id: 6 }
                }
              },
              Shape: {
                fields: {
                  type: { type: 'ShapeType', id: 1 },
                  shapeArgs: { type: 'ShapeArgs', id: 2 },
                  rectArgs: { type: 'RectArgs', id: 3 },
                  ellipseArgs: { type: 'EllipseArgs', id: 4 },
                  styles: { type: 'ShapeStyle', id: 10 },
                  transform: { type: 'Transform', id: 11 }
                },
                nested: {
                  ShapeType: { values: { SHAPE: 0, RECT: 1, ELLIPSE: 2, KEEP: 3 } },
                  ShapeArgs: { fields: { d: { type: 'string', id: 1 } } },
                  RectArgs: {
                    fields: {
                      x: { type: 'float', id: 1 },
                      y: { type: 'float', id: 2 },
                      width: { type: 'float', id: 3 },
                      height: { type: 'float', id: 4 },
                      cornerRadius: { type: 'float', id: 5 }
                    }
                  },
                  EllipseArgs: {
                    fields: {
                      x: { type: 'float', id: 1 },
                      y: { type: 'float', id: 2 },
                      radiusX: { type: 'float', id: 3 },
                      radiusY: { type: 'float', id: 4 }
                    }
                  },
                  ShapeStyle: {
                    fields: {
                      fill: { type: 'RGBAColor', id: 1 },
                      stroke: { type: 'RGBAColor', id: 2 },
                      strokeWidth: { type: 'float', id: 3 },
                      lineCap: { type: 'LineCap', id: 4 },
                      lineJoin: { type: 'LineJoin', id: 5 },
                      miterLimit: { type: 'float', id: 6 },
                      lineDashI: { type: 'float', id: 7 },
                      lineDashII: { type: 'float', id: 8 },
                      lineDashIII: { type: 'float', id: 9 }
                    },
                    nested: {
                      RGBAColor: {
                        fields: {
                          r: { type: 'float', id: 1 },
                          g: { type: 'float', id: 2 },
                          b: { type: 'float', id: 3 },
                          a: { type: 'float', id: 4 }
                        }
                      },
                      LineCap: { values: { LineCap_BUTT: 0, LineCap_ROUND: 1, LineCap_SQUARE: 2 } },
                      LineJoin: { values: { LineJoin_MITER: 0, LineJoin_ROUND: 1, LineJoin_BEVEL: 2 } }
                    }
                  }
                }
              },
              Frame: {
                fields: {
                  alpha: { type: 'float', id: 1 },
                  layout: { type: 'Layout', id: 2 },
                  transform: { type: 'Transform', id: 3 },
                  clipPath: { type: 'string', id: 4 },
                  shapes: { rule: 'repeated', type: 'Shape', id: 5 }
                }
              },
              AudioDefine: {
                fields: {
                  audioKey: { type: 'string', id: 1 },
                  startFrame: { type: 'int32', id: 2 },
                  endFrame: { type: 'int32', id: 3 },
                  totalFrame: { type: 'int32', id: 4 },
                  audioSource: { type: 'bytes', id: 5 }
                }
              },
              MovieEntity: {
                fields: {
                  version: { type: 'string', id: 1 },
                  params: { type: 'MovieParams', id: 2 },
                  images: { keyType: 'string', type: 'bytes', id: 3 },
                  sprites: { rule: 'repeated', type: 'Sprite', id: 4 },
                  audios: { rule: 'repeated', type: 'AudioDefine', id: 5 }
                }
              }
            }
          }
        }
      };
      
      const rootLite = protobuf.Root.fromJSON(SVGA_PROTO_LITE);
      MovieEntityLite = rootLite.lookupType('svga.MovieEntity');
      
      log('Protobuf 初始化成功 (standard + lite)', 'success');
    }

    function log(message, type = 'info') {
      const logDiv = document.getElementById('log');
      const timestamp = new Date().toLocaleTimeString();
      const line = document.createElement('div');
      line.className = `log ${type}`;
      line.textContent = `[${timestamp}] ${message}`;
      logDiv.appendChild(line);
      logDiv.scrollTop = logDiv.scrollHeight;
      console.log(`[${type.toUpperCase()}]`, message);
    }

    function parseSVGA(buffer) {
      const data = new Uint8Array(buffer);
      const magic = String.fromCharCode(...data.slice(0, 4));
      let version = 0x02;
      let decompressed;
      let hasHeader = false;
      
      if (magic === 'SVGA') {
        hasHeader = true;
        version = data[4];
        if (version === 0x02) {
          decompressed = pako.inflate(data.slice(8));
        } else {
          decompressed = data.slice(8);
        }
      } else {
        try {
          decompressed = pako.inflate(data);
        } catch (e) {
          decompressed = data;
          version = 0x01;
        }
      }
      
      const message = MovieEntity.decode(decompressed);
      const movieObj = MovieEntity.toObject(message, {
        bytes: Uint8Array,
        arrays: true,
        objects: true
      });
      
      return { movieObj, version, decompressed, hasHeader, rawData: data };
    }

    function getImageMimeType(data) {
      if (!data || data.length < 12) return 'unknown';
      if (data[0] === 0x89 && data[1] === 0x50) return 'image/png';
      if (data[0] === 0xFF && data[1] === 0xD8) return 'image/jpeg';
      if (data[0] === 0x52 && data[1] === 0x49 && data[8] === 0x57) return 'image/webp';
      if (data[0] === 0x47 && data[1] === 0x49) return 'image/gif';
      return 'unknown';
    }

    function displayHexView(data, elementId, length = 64) {
      const element = document.getElementById(elementId);
      let html = '';
      const viewLength = Math.min(data.length, length);
      
      for (let i = 0; i < viewLength; i += 16) {
        const offset = i.toString(16).padStart(8, '0');
        const bytes = [];
        for (let j = 0; j < 16 && i + j < viewLength; j++) {
          bytes.push(data[i + j].toString(16).padStart(2, '0'));
        }
        html += `<div class="hex-line"><span class="hex-offset">${offset}</span> <span class="hex-bytes">${bytes.join(' ')}</span></div>`;
      }
      
      if (data.length > length) {
        html += `<div class="hex-line"><span class="hex-offset">... (${data.length - length} more bytes)</span></div>`;
      }
      
      element.innerHTML = html;
    }

    function displayImages(movieObj, containerId) {
      const container = document.getElementById(containerId);
      container.innerHTML = '';
      
      if (!movieObj.images) {
        container.innerHTML = '<p style="color: #999;">没有图片</p>';
        return;
      }
      
      for (const key of Object.keys(movieObj.images)) {
        const data = movieObj.images[key];
        const mime = getImageMimeType(data);
        const blob = new Blob([data], { type: mime });
        const url = URL.createObjectURL(blob);
        
        const item = document.createElement('div');
        item.className = 'image-item';
        item.innerHTML = `
          <img src="${url}" alt="${key}">
          <p>${key.substring(0, 20)}...<br>${mime.split('/')[1].toUpperCase()}<br>${data.length} bytes</p>
        `;
        container.appendChild(item);
      }
    }

    function compareImages(original, exported) {
      const origImages = original.movieObj.images || {};
      const expImages = exported.movieObj.images || {};
      const origKeys = Object.keys(origImages);
      const expKeys = Object.keys(expImages);
      
      const issues = [];
      
      if (origKeys.length !== expKeys.length) {
        issues.push(`图片数量不同: ${origKeys.length} vs ${expKeys.length}`);
      }
      
      for (const key of origKeys) {
        if (!expImages[key]) {
          issues.push(`导出文件缺少图片: ${key}`);
          continue;
        }
        
        const origData = origImages[key];
        const expData = expImages[key];
        
        // 比较前100字节
        let same = true;
        const compareLength = Math.min(origData.length, expData.length, 100);
        for (let i = 0; i < compareLength; i++) {
          if (origData[i] !== expData[i]) {
            same = false;
            issues.push(`图片 "${key}" 数据不同 (位置 ${i})`);
            break;
          }
        }
        
        if (origData.length !== expData.length) {
          issues.push(`图片 "${key}" 大小不同: ${origData.length} vs ${expData.length}`);
        }
      }
      
      return issues;
    }

    function exportSVGA(movieObj, version) {
      // 使用 lite 格式（无文件头）
      // 参考：https://github.com/Gluttony-boop/svga-editor_new
      
      // 转换为 lite 格式，保留 undefined 值
      const movieEntityLite = {
        version: movieObj.version || '2.0',
        params: movieObj.params ? {
          viewBoxWidth: movieObj.params.viewBoxWidth || 0,
          viewBoxHeight: movieObj.params.viewBoxHeight || 0,
          fps: movieObj.params.fps || 24,
          frames: movieObj.params.frames || 0
        } : null,
        images: movieObj.images || {},
        sprites: (movieObj.sprites || []).map(sprite => {
          const spriteData = {
            imageKey: sprite.imageKey || '',
            frames: (sprite.frames || []).map(frame => {
              const frameData = {
                alpha: frame.alpha !== undefined ? frame.alpha : 1
              };
              
              // Layout - 只添加存在的字段
              if (frame.layout) {
                frameData.layout = {};
                if (frame.layout.x !== undefined) frameData.layout.x = frame.layout.x;
                if (frame.layout.y !== undefined) frameData.layout.y = frame.layout.y;
                if (frame.layout.width !== undefined) frameData.layout.width = frame.layout.width;
                if (frame.layout.height !== undefined) frameData.layout.height = frame.layout.height;
              }
              
              // Transform - 只添加存在的字段
              if (frame.transform) {
                frameData.transform = {};
                if (frame.transform.a !== undefined) frameData.transform.a = frame.transform.a;
                if (frame.transform.b !== undefined) frameData.transform.b = frame.transform.b;
                if (frame.transform.c !== undefined) frameData.transform.c = frame.transform.c;
                if (frame.transform.d !== undefined) frameData.transform.d = frame.transform.d;
                if (frame.transform.tx !== undefined) frameData.transform.tx = frame.transform.tx;
                if (frame.transform.ty !== undefined) frameData.transform.ty = frame.transform.ty;
              }
              
              if (frame.clipPath) frameData.clipPath = frame.clipPath;
              if (frame.shapes && frame.shapes.length > 0) frameData.shapes = frame.shapes;
              
              return frameData;
            })
          };
          
          return spriteData;
        }),
        audios: movieObj.audios || []
      };
      
      // 使用 lite protobuf 编码
      const encoded = MovieEntityLite.encode(movieEntityLite).finish();
      
      // 使用 pako.deflate 压缩（无文件头）
      const compressed = pako.deflate(encoded);
      
      return compressed;
    }

    function displayComparison(original, exported, exportedData) {
      const results = document.getElementById('comparison-results');
      const imageIssues = compareImages(original, exported);
      
      const rows = [
        ['文件格式', original.hasHeader ? '标准SVGA' : '无文件头', '标准SVGA'],
        ['文件头', original.hasHeader ? 'SVGA' : '无', 'SVGA'],
        ['版本', original.version === 0x02 ? '2.0' : '1.0', exported.version === 0x02 ? '2.0' : '1.0'],
        ['文件大小', `${original.rawData.length} 字节`, `${exportedData.length} 字节`],
        ['解压后大小', `${original.decompressed.length} 字节`, `${exported.decompressed.length} 字节`],
        ['Protobuf版本', original.movieObj.version || '未设置', exported.movieObj.version || '未设置'],
        ['宽度', original.movieObj.params?.viewBoxWidth || 0, exported.movieObj.params?.viewBoxWidth || 0],
        ['高度', original.movieObj.params?.viewBoxHeight || 0, exported.movieObj.params?.viewBoxHeight || 0],
        ['帧数', original.movieObj.params?.frames || 0, exported.movieObj.params?.frames || 0],
        ['帧率', original.movieObj.params?.fps || 0, exported.movieObj.params?.fps || 0],
        ['图片数量', Object.keys(original.movieObj.images || {}).length, Object.keys(exported.movieObj.images || {}).length],
        ['精灵数量', original.movieObj.sprites?.length || 0, exported.movieObj.sprites?.length || 0]
      ];
      
      let html = '<table><thead><tr><th>项目</th><th>原始文件</th><th>导出文件</th><th>状态</th></tr></thead><tbody>';
      
      for (const [label, orig, exp] of rows) {
        const diff = String(orig) !== String(exp);
        html += `
          <tr>
            <td><strong>${label}</strong></td>
            <td>${orig}</td>
            <td class="${diff ? 'diff' : 'same'}">${exp}</td>
            <td>${diff ? '❌' : '✅'}</td>
          </tr>
        `;
      }
      
      html += '</tbody></table>';
      
      if (imageIssues.length > 0) {
        html += '<h3 style="color: #f44336; margin-top: 20px;">⚠️ 发现图片问题</h3><ul>';
        for (const issue of imageIssues) {
          html += `<li style="color: #f44336;">${issue}</li>`;
        }
        html += '</ul>';
      } else {
        html += '<p style="color: #4caf50; margin-top: 20px; font-weight: bold;">✅ 所有图片数据完全一致</p>';
      }
      
      results.innerHTML = html;
    }

    function downloadFile(data, filename) {
      const blob = new Blob([data], { type: 'application/octet-stream' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }

    document.addEventListener('DOMContentLoaded', async () => {
      await initProtobuf();
      
      const fileInput = document.getElementById('file-input');
      const exportBtn = document.getElementById('export-btn');
      const downloadOriginalBtn = document.getElementById('download-original-btn');
      const downloadExportedBtn = document.getElementById('download-exported-btn');
      
      fileInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        
        log(`加载文件: ${file.name} (${file.size} 字节)`);
        
        try {
          originalBuffer = await file.arrayBuffer();
          const parsed = parseSVGA(originalBuffer);
          
          log(`解析成功: ${parsed.hasHeader ? '标准格式' : '无文件头'}, 版本 ${parsed.version}`);
          log(`解压后大小: ${parsed.decompressed.length} 字节`);
          log(`图片数量: ${Object.keys(parsed.movieObj.images || {}).length}`);
          
          displayHexView(parsed.rawData, 'original-hex');
          displayImages(parsed.movieObj, 'original-images');
          
          exportBtn.disabled = false;
          downloadOriginalBtn.disabled = false;
          
          log('文件加载完成', 'success');
        } catch (err) {
          log(`加载失败: ${err.message}`, 'error');
          console.error(err);
        }
      });
      
      exportBtn.addEventListener('click', async () => {
        if (!originalBuffer) return;
        
        try {
          log('--- 开始导出测试 ---');
          
          const original = parseSVGA(originalBuffer);
          const exportedData = exportSVGA(original.movieObj, original.version);
          exportedBuffer = exportedData.buffer;
          
          log(`导出成功: ${exportedData.length} 字节`);
          
          // 解析导出的文件
          const exported = parseSVGA(exportedData.buffer);
          
          // 显示对比
          displayComparison(original, exported, exportedData);
          displayHexView(exportedData, 'exported-hex');
          displayImages(exported.movieObj, 'exported-images');
          
          downloadExportedBtn.disabled = false;
          
          log('对比完成', 'success');
          
          // 自动下载
          downloadFile(exportedData, 'exported-diagnostic.svga');
          log('已自动下载导出文件', 'info');
        } catch (err) {
          log(`导出失败: ${err.message}`, 'error');
          console.error(err);
        }
      });
      
      downloadOriginalBtn.addEventListener('click', () => {
        if (!originalBuffer) return;
        
        const parsed = parseSVGA(originalBuffer);
        if (!parsed.hasHeader) {
          const standardData = exportSVGA(parsed.movieObj, parsed.version);
          downloadFile(standardData, 'original-standard.svga');
          log('已下载标准格式的原始文件', 'success');
        } else {
          downloadFile(new Uint8Array(originalBuffer), 'original.svga');
          log('已下载原始文件', 'success');
        }
      });
      
      downloadExportedBtn.addEventListener('click', () => {
        if (!exportedBuffer) return;
        downloadFile(new Uint8Array(exportedBuffer), 'exported.svga');
        log('已下载导出文件', 'success');
      });
    });
  </script>
</body>
</html>
