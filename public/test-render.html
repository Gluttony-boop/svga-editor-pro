<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>SVGA 渲染对比测试</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #1a1a2e; color: #eee; }
    .container { display: flex; gap: 20px; margin-top: 20px; }
    .panel { flex: 1; background: #16213e; border-radius: 8px; padding: 16px; }
    h2 { margin: 0 0 16px 0; font-size: 16px; }
    canvas { background: #fff; border-radius: 4px; display: block; }
    .info { margin-top: 12px; font-size: 12px; color: #888; }
    .sprite-info { margin-top: 12px; font-size: 11px; max-height: 400px; overflow-y: auto; }
    .sprite-info div { padding: 8px; margin: 4px 0; border-bottom: 1px solid #333; background: #0f3460; border-radius: 4px; }
    .sprite-info .key { color: #e94560; font-weight: bold; }
    .sprite-info .value { color: #0f9; font-family: monospace; }
    .diff { background: #4a1c1c !important; }
    input[type="file"] { margin-bottom: 12px; }
    .frame-controls { margin-top: 12px; display: flex; gap: 8px; align-items: center; }
    button { padding: 8px 16px; cursor: pointer; background: #e94560; border: none; color: white; border-radius: 4px; }
    button:hover { background: #ff6b6b; }
    .tabs { display: flex; gap: 4px; margin-bottom: 12px; }
    .tab { padding: 8px 16px; background: #333; border: none; color: #888; cursor: pointer; border-radius: 4px 4px 0 0; }
    .tab.active { background: #16213e; color: #fff; }
  </style>
</head>
<body>
  <h1>SVGA 渲染对比测试</h1>
  <input type="file" id="fileInput" accept=".svga">
  
  <div class="container">
    <div class="panel">
      <h2>官方 SVGAPlayer-Web-Lite</h2>
      <canvas id="officialCanvas" width="375" height="375"></canvas>
      <div class="info" id="officialInfo">等待加载...</div>
    </div>
    
    <div class="panel">
      <h2>当前渲染器 (修复后)</h2>
      <canvas id="customCanvas" width="375" height="375"></canvas>
      <div class="info" id="customInfo">等待加载...</div>
    </div>
  </div>
  
  <div class="panel" style="margin-top: 20px;">
    <div class="tabs">
      <button class="tab active" data-tab="sprites">精灵信息</button>
      <button class="tab" data-tab="frame">当前帧数据</button>
      <button class="tab" data-tab="compare">渲染差异</button>
    </div>
    
    <div id="tab-sprites" class="sprite-info">等待加载...</div>
    <div id="tab-frame" class="sprite-info" style="display:none">等待加载...</div>
    <div id="tab-compare" class="sprite-info" style="display:none">等待加载...</div>
    
    <div class="frame-controls">
      <button id="prevFrame">◀ 上一帧</button>
      <span id="frameLabel">帧: 0 / 0</span>
      <button id="nextFrame">下一帧 ▶</button>
      <button id="playBtn">▶ 播放</button>
    </div>
  </div>

  <!-- 官方 SVGAPlayer -->
  <script src="https://cdn.jsdelivr.net/npm/svga@2.1.0/lib/svga.min.js"></script>
  
  <script>
    // 全局状态
    let svgaData = null;
    let currentFrame = 0;
    let isPlaying = false;
    let playInterval = null;
    
    // 获取元素
    const fileInput = document.getElementById('fileInput');
    const officialCanvas = document.getElementById('officialCanvas');
    const customCanvas = document.getElementById('customCanvas');
    const officialCtx = officialCanvas.getContext('2d');
    const customCtx = customCanvas.getContext('2d');
    const officialInfo = document.getElementById('officialInfo');
    const customInfo = document.getElementById('customInfo');
    const frameLabel = document.getElementById('frameLabel');
    
    // Tab 切换
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        document.querySelectorAll('[id^="tab-"]').forEach(p => p.style.display = 'none');
        document.getElementById('tab-' + tab.dataset.tab).style.display = 'block';
      });
    });
    
    // 自动加载 test.svga
    async function loadDefaultSvga() {
      try {
        const response = await fetch('/test.svga');
        const buffer = await response.arrayBuffer();
        loadSvgaBuffer(buffer);
      } catch (e) {
        console.log('自动加载 test.svga 失败:', e);
      }
    }
    loadDefaultSvga();
    
    // 加载 SVGA buffer
    function loadSvgaBuffer(buffer) {
      // 使用官方播放器解析
      const parser = new SVGA.Parser();
      parser.load(buffer, (videoItem) => {
        svgaData = videoItem;
        console.log('=== SVGA Data ===', videoItem);
        console.log('=== Images ===', Object.keys(videoItem.images));
        
        // 调整 canvas 大小
        officialCanvas.width = videoItem.videoSize.width;
        officialCanvas.height = videoItem.videoSize.height;
        customCanvas.width = videoItem.videoSize.width;
        customCanvas.height = videoItem.videoSize.height;
        
        // 显示精灵信息
        showSpriteInfo(videoItem);
        
        // 渲染
        currentFrame = 0;
        renderFrame(0);
        
        officialInfo.textContent = `尺寸: ${videoItem.videoSize.width}x${videoItem.videoSize.height}, 帧: ${videoItem.frames}, FPS: ${videoItem.fps}`;
      });
    }
    
    // 文件输入处理
    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      
      const buffer = await file.arrayBuffer();
      loadSvgaBuffer(buffer);
    });
    
    // 显示精灵信息
    function showSpriteInfo(videoItem) {
      let html = `<div><strong>总览</strong>: ${videoItem.sprites.length} 个精灵, ${videoItem.frames} 帧</div>`;
      videoItem.sprites.forEach((sprite, idx) => {
        const frame0 = sprite.frames[0] || {};
        html += `<div>
          <span class="key">精灵 ${idx}</span>: <span class="value">${sprite.imageKey || '(无key)'}</span><br>
          帧数: <span class="value">${sprite.frames.length}</span><br>
          第0帧 alpha: <span class="value">${frame0.alpha?.toFixed(3) ?? 'N/A'}</span>
        </div>`;
      });
      document.getElementById('tab-sprites').innerHTML = html;
    }
    
    // 显示当前帧数据
    function showFrameData(frameIndex) {
      if (!svgaData) return;
      
      let html = `<div><strong>帧 ${frameIndex}</strong></div>`;
      svgaData.sprites.forEach((sprite, idx) => {
        const frame = sprite.frames[frameIndex];
        if (!frame) {
          html += `<div class="diff"><span class="key">精灵 ${idx}</span>: 无此帧数据</div>`;
          return;
        }
        
        const layoutStr = frame.layout 
          ? `{x: ${frame.layout.x?.toFixed(1) ?? 'null'}, y: ${frame.layout.y?.toFixed(1) ?? 'null'}, w: ${frame.layout.width?.toFixed(1) ?? 'null'}, h: ${frame.layout.height?.toFixed(1) ?? 'null'}}`
          : 'null';
        const txStr = frame.transform
          ? `{a: ${frame.transform.a?.toFixed(3) ?? 'null'}, b: ${frame.transform.b?.toFixed(3) ?? 'null'}, c: ${frame.transform.c?.toFixed(3) ?? 'null'}, d: ${frame.transform.d?.toFixed(3) ?? 'null'}, tx: ${frame.transform.tx?.toFixed(1) ?? 'null'}, ty: ${frame.transform.ty?.toFixed(1) ?? 'null'}}`
          : 'null';
        
        html += `<div>
          <span class="key">精灵 ${idx}</span> (${sprite.imageKey || 'no-key'})<br>
          alpha: <span class="value">${frame.alpha?.toFixed(3) ?? 'N/A'}</span><br>
          layout: <span class="value">${layoutStr}</span><br>
          transform: <span class="value">${txStr}</span>
        </div>`;
      });
      document.getElementById('tab-frame').innerHTML = html;
    }
    
    // 渲染指定帧
    function renderFrame(frameIndex) {
      if (!svgaData) return;
      
      frameLabel.textContent = `帧: ${frameIndex} / ${svgaData.frames}`;
      showFrameData(frameIndex);
      
      // 清除画布
      officialCtx.fillStyle = '#fff';
      officialCtx.fillRect(0, 0, officialCanvas.width, officialCanvas.height);
      customCtx.fillStyle = '#fff';
      customCtx.fillRect(0, 0, customCanvas.width, customCanvas.height);
      
      // 官方渲染
      renderOfficial(frameIndex);
      
      // 自定义渲染
      renderCustom(frameIndex);
      
      // 比较差异
      compareCanvases();
    }
    
    // 官方渲染 - 完全按照 SVGAPlayer-Web-Lite 的方式
    function renderOfficial(frameIndex) {
      svgaData.sprites.forEach(sprite => {
        const frame = sprite.frames[frameIndex];
        if (!frame || frame.alpha < 0.05) return;
        
        const imageKey = sprite.imageKey;
        const bitmap = svgaData.images[imageKey];
        if (!bitmap) return;
        
        officialCtx.save();
        officialCtx.globalAlpha = frame.alpha;
        
        // 应用变换矩阵
        if (frame.transform) {
          officialCtx.transform(
            frame.transform.a ?? 1,
            frame.transform.b ?? 0,
            frame.transform.c ?? 0,
            frame.transform.d ?? 1,
            frame.transform.tx ?? 0,
            frame.transform.ty ?? 0
          );
        }
        
        // 官方方式：只在 layout 有效时绘制
        if (frame.layout && frame.layout.width > 0 && frame.layout.height > 0) {
          officialCtx.drawImage(bitmap, 0, 0, frame.layout.width, frame.layout.height);
        }
        
        officialCtx.restore();
      });
    }
    
    // 自定义渲染 - 修复后的方式
    function renderCustom(frameIndex) {
      svgaData.sprites.forEach((sprite, idx) => {
        const frame = sprite.frames[frameIndex];
        if (!frame || frame.alpha < 0.05) return;
        
        const imageKey = sprite.imageKey;
        const bitmap = svgaData.images[imageKey];
        if (!bitmap) return;
        
        customCtx.save();
        customCtx.globalAlpha = frame.alpha;
        
        // 应用变换矩阵
        if (frame.transform) {
          customCtx.transform(
            frame.transform.a ?? 1,
            frame.transform.b ?? 0,
            frame.transform.c ?? 0,
            frame.transform.d ?? 1,
            frame.transform.tx ?? 0,
            frame.transform.ty ?? 0
          );
        }
        
        // 关键修复：只在 layout.width 和 layout.height 存在时绘制
        // 如果 layout 不存在或 width/height 为 0，则不绘制
        const layout = frame.layout;
        if (layout && layout.width && layout.height) {
          customCtx.drawImage(bitmap, 0, 0, layout.width, layout.height);
        } else {
          console.log(`精灵 ${idx} (${imageKey}) 跳过绘制: layout=${JSON.stringify(layout)}`);
        }
        
        customCtx.restore();
      });
    }
    
    // 比较两个 canvas 的差异
    function compareCanvases() {
      const officialData = officialCtx.getImageData(0, 0, officialCanvas.width, officialCanvas.height);
      const customData = customCtx.getImageData(0, 0, customCanvas.width, customCanvas.height);
      
      let diffCount = 0;
      let maxDiff = 0;
      
      for (let i = 0; i < officialData.data.length; i += 4) {
        const rDiff = Math.abs(officialData.data[i] - customData.data[i]);
        const gDiff = Math.abs(officialData.data[i + 1] - customData.data[i + 1]);
        const bDiff = Math.abs(officialData.data[i + 2] - customData.data[i + 2]);
        const aDiff = Math.abs(officialData.data[i + 3] - customData.data[i + 3]);
        
        const totalDiff = rDiff + gDiff + bDiff + aDiff;
        if (totalDiff > 10) {
          diffCount++;
          maxDiff = Math.max(maxDiff, totalDiff);
        }
      }
      
      const totalPixels = officialData.data.length / 4;
      const diffPercent = (diffCount / totalPixels * 100).toFixed(2);
      
      let html = `<div>像素差异统计:</div>`;
      html += `<div>总像素: ${totalPixels.toLocaleString()}</div>`;
      html += `<div>差异像素: ${diffCount.toLocaleString()} (${diffPercent}%)</div>`;
      html += `<div>最大差异: ${maxDiff}</div>`;
      
      if (diffCount === 0) {
        html += `<div style="color: #0f9; font-weight: bold;">✓ 两个渲染器完全一致!</div>`;
      } else {
        html += `<div style="color: #e94560; font-weight: bold;">✗ 存在渲染差异</div>`;
      }
      
      document.getElementById('tab-compare').innerHTML = html;
    }
    
    // 帧控制
    document.getElementById('prevFrame').addEventListener('click', () => {
      if (!svgaData) return;
      currentFrame = Math.max(0, currentFrame - 1);
      renderFrame(currentFrame);
    });
    
    document.getElementById('nextFrame').addEventListener('click', () => {
      if (!svgaData) return;
      currentFrame = Math.min(svgaData.frames - 1, currentFrame + 1);
      renderFrame(currentFrame);
    });
    
    document.getElementById('playBtn').addEventListener('click', () => {
      isPlaying = !isPlaying;
      document.getElementById('playBtn').textContent = isPlaying ? '⏸ 暂停' : '▶ 播放';
      
      if (isPlaying) {
        playInterval = setInterval(() => {
          currentFrame = (currentFrame + 1) % svgaData.frames;
          renderFrame(currentFrame);
        }, 1000 / svgaData.fps);
      } else {
        clearInterval(playInterval);
      }
    });
  </script>
</body>
</html>
